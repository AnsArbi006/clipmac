name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          CLIPMAC_DATA_DIR: ${{ runner.temp }}/clipmac-tests
      - name: JavaScript syntax
        run: for script in clipmac/*.js; do node --check "$script"; done
      - name: Synthetic development fixture
        run: python -m clipmac.dev --data-dir "$RUNNER_TEMP/clipmac-demo" --seed-only
      - name: Publication check
        run: python scripts/check_publication.py
